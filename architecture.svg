<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Roboto, Noto Sans, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#f3f5f9"/>
  <rect y="0" width="427" height="5" fill="#f59e0b"/><rect x="427" y="0" width="426" height="5" fill="#ffffff"/><rect x="853" y="0" width="427" height="5" fill="#16a34a"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#0b2545">NE Pharma Supply Planner — high-level architecture</text>
  <text x="40" y="76" font-size="14" fill="#64748b">NESFIC 2026 · NESFIC-I-09 · open-source, self-hosted in India, no special hardware</text>

  <!-- column 1: sources -->
  <g filter="url(#sh)">
    <rect x="40" y="110" width="230" height="420" rx="14" fill="#fff" stroke="#e2e8f0"/>
  </g>
  <text x="60" y="140" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">DATA SOURCES</text>
  <g font-size="14" fill="#0f172a">
    <rect x="60" y="158" width="190" height="56" rx="10" fill="#eaf1fd"/><text x="74" y="182" font-weight="600">ERP dispatch export</text><text x="74" y="201" font-size="12" fill="#475569">Rani C&amp;F depot</text>
    <rect x="60" y="226" width="190" height="56" rx="10" fill="#eaf1fd"/><text x="74" y="250" font-weight="600">Stockist sales &amp; stock</text><text x="74" y="269" font-size="12" fill="#475569">weekly, 8 NE states</text>
    <rect x="60" y="294" width="190" height="56" rx="10" fill="#eaf1fd"/><text x="74" y="318" font-weight="600">Batch &amp; expiry register</text><text x="74" y="337" font-size="12" fill="#475569">mfg / expiry per batch</text>
    <rect x="60" y="362" width="190" height="56" rx="10" fill="#eaf1fd"/><text x="74" y="386" font-weight="600">Medicine master</text><text x="74" y="405" font-size="12" fill="#475569">packs, MRP, shelf life</text>
  </g>
  <text x="60" y="452" font-size="12" fill="#475569">CSV / Excel exports</text>
  <text x="60" y="470" font-size="12" fill="#475569">• scheduled SFTP drop (pilot)</text>
  <text x="60" y="488" font-size="12" fill="#475569">• manual upload with checks</text>
  <text x="60" y="512" font-size="11" fill="#94a3b8">Prototype: synthetic data (sim.py)</text>

  <!-- column 2: weekly run -->
  <g filter="url(#sh)"><rect x="320" y="110" width="330" height="420" rx="14" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="340" y="140" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">WEEKLY PLANNING RUN</text>
  <text x="340" y="158" font-size="12" fill="#475569">server/build.py · Python · NumPy · ~1 min</text>
  <g font-size="14" fill="#0f172a">
    <rect x="340" y="172" width="290" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="356" y="199"><tspan font-weight="700" fill="#0f766e">1 </tspan>Validate &amp; load data</text>
    <rect x="340" y="224" width="290" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="356" y="251"><tspan font-weight="700" fill="#0f766e">2 </tspan>Features: sales lags, season, route</text>
    <rect x="340" y="276" width="290" height="58" rx="10" fill="#e6f4f1" stroke="#9bd3c8"/><text x="356" y="300"><tspan font-weight="700" fill="#0f766e">3 </tspan><tspan font-weight="600">Forecast model</tspan></text><text x="374" y="320" font-size="12" fill="#0f5f58">gradient boosting · p10 / p50 / p90 · 1–8 weeks</text>
    <rect x="340" y="342" width="290" height="58" rx="10" fill="#e6f4f1" stroke="#9bd3c8"/><text x="356" y="366"><tspan font-weight="700" fill="#0f766e">4 </tspan><tspan font-weight="600">Planner</tspan></text><text x="374" y="386" font-size="12" fill="#0f5f58">target stock · transfers · expiry-capped orders</text>
    <rect x="340" y="408" width="290" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="356" y="435"><tspan font-weight="700" fill="#0f766e">5 </tspan>Alerts + plain-language reasons</text>
    <rect x="340" y="460" width="290" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="356" y="487"><tspan font-weight="700" fill="#0f766e">6 </tspan>Backtest KPIs (manual vs planner)</text>
  </g>

  <!-- column 3: db + api -->
  <g filter="url(#sh)"><rect x="700" y="110" width="250" height="160" rx="14" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="720" y="140" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">DATABASE</text>
  <g transform="translate(720,154)">
    <ellipse cx="34" cy="10" rx="34" ry="10" fill="#13315c"/><rect x="0" y="10" width="68" height="56" fill="#13315c"/><ellipse cx="34" cy="66" rx="34" ry="10" fill="#0b2545"/>
    <ellipse cx="34" cy="10" rx="34" ry="10" fill="#1f4b85"/>
  </g>
  <text x="804" y="176" font-size="15" font-weight="700" fill="#0f172a">SQLite</text>
  <text x="804" y="196" font-size="12" fill="#475569">data/nepd.db · one file</text>
  <text x="804" y="214" font-size="12" fill="#475569">18 tables · forecasts,</text>
  <text x="804" y="232" font-size="12" fill="#475569">batches, orders, audit</text>
  <text x="720" y="258" font-size="11" fill="#94a3b8">→ PostgreSQL at scale</text>

  <g filter="url(#sh)"><rect x="700" y="300" width="250" height="230" rx="14" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="720" y="330" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">API SERVER</text>
  <text x="720" y="354" font-size="15" font-weight="700" fill="#0f172a">FastAPI + Uvicorn</text>
  <text x="720" y="372" font-size="12" fill="#475569">server/api.py · 28 endpoints</text>
  <g font-size="13" fill="#334155">
    <text x="720" y="400">• Plan, forecast, inventory, expiry</text>
    <text x="720" y="421">• Approve / change / reject</text>
    <text x="720" y="442">• Orders, transfers, receipts</text>
    <text x="720" y="463">• What-if (Monte Carlo)</text>
    <text x="720" y="484">• CSV upload checks &amp; export</text>
    <text x="720" y="505">• Role scoping · audit log</text>
  </g>

  <!-- column 4: users -->
  <g filter="url(#sh)"><rect x="1000" y="110" width="240" height="420" rx="14" fill="#0b2545"/></g>
  <text x="1020" y="140" font-size="12" font-weight="700" fill="#8fb3d9" letter-spacing="1.5">WEB APP / PWA</text>
  <text x="1020" y="164" font-size="15" font-weight="700" fill="#fff">HTML · CSS · JavaScript</text>
  <text x="1020" y="183" font-size="12" fill="#c7d6ea">SVG charts · service worker</text>
  <g font-size="13" fill="#e2e8f0">
    <text x="1020" y="214">Overview · Replenishment plan</text>
    <text x="1020" y="234">Forecast · What-if</text>
    <text x="1020" y="254">Inventory · Batches &amp; expiry</text>
    <text x="1020" y="274">Orders · Alerts · Map</text>
    <text x="1020" y="294">Impact · Data import · Admin</text>
  </g>
  <line x1="1020" y1="314" x2="1220" y2="314" stroke="#1f4b85"/>
  <text x="1020" y="340" font-size="12" font-weight="700" fill="#8fb3d9" letter-spacing="1.5">USERS</text>
  <g font-size="13" fill="#fff">
    <rect x="1020" y="352" width="200" height="30" rx="8" fill="#13315c"/><text x="1032" y="372">Head of Supply Chain</text>
    <rect x="1020" y="388" width="200" height="30" rx="8" fill="#13315c"/><text x="1032" y="408">Supply planners</text>
    <rect x="1020" y="424" width="200" height="30" rx="8" fill="#13315c"/><text x="1032" y="444">Regional managers</text>
    <rect x="1020" y="460" width="200" height="30" rx="8" fill="#13315c"/><text x="1032" y="480">Field / sales (read-only)</text>
  </g>
  <text x="1020" y="514" font-size="11" fill="#8fb3d9">Desktop · tablet · phone · offline read</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M270 320 H316"/>
    <path d="M650 300 C675 300 675 190 696 190"/>
    <path d="M825 274 V296" marker-start="url(#ar)"/>
    <path d="M950 415 H996" marker-start="url(#ar)"/>
  </g>
  <text x="954" y="404" font-size="11" fill="#475569">HTTPS</text>
  <text x="954" y="436" font-size="11" fill="#475569">JSON</text>
  <path d="M1110 530 C1110 578 160 578 160 534" stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="640" y="606" font-size="12" fill="#64748b" text-anchor="middle">CSV uploads from the Data import screen (checked before use)</text>

  <!-- footer band -->
  <g filter="url(#sh)"><rect x="40" y="618" width="1200" height="74" rx="14" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="60" y="645" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">RUNS ON</text>
  <text x="60" y="672" font-size="14" fill="#0f172a">One VM in an Indian region (2 vCPU / 4 GB) or GRD on-premises · Docker or ./run.sh</text>
  <text x="700" y="645" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">SECURITY &amp; COMPLIANCE</text>
  <text x="700" y="672" font-size="14" fill="#0f172a">Data stays in India · role-based access · audit trail · FEFO · no patient data</text>
</svg>
